cdc_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'user') }}"
      password: "{{ env_var('DB_PASSWORD', 'password') }}"
      port: 5433
      dbname: "{{ env_var('DB_NAME', 'warehouse_db') }}"
      schema: silver
      threads: 4
